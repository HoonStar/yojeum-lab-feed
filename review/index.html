<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E7C7B">
<title>리뷰 공방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 아내용 폰 앱: 목록 → 상품 상세(사진·메모·리뷰) 한 화면 흐름. 남편 GitHub 비공개 저장소가 서버 역할. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#182029; --ink-2:#4B5663; --ink-3:#7B8794; --line:#D6DCE3;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --accent-soft:#D8F0EE;
  --good:#1F7A3A; --good-soft:#DDF3E3; --warn:#9A5B00; --warn-soft:#FBEBCF; --crit:#B3261E; --crit-soft:#F9DDDA; --info:#2E5AAC; --info-soft:#DCE6F8;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0F1419; --surface:#171D24; --surface-2:#1F2730; --ink:#E7ECF1; --ink-2:#AEB8C2; --ink-3:#7F8B97; --line:#2B3540;
  --accent:#3BBFB4; --accent-ink:#06211F; --accent-soft:#143A38;
  --good:#5ED08A; --good-soft:#15331F; --warn:#F0B35A; --warn-soft:#3A2A0E; --crit:#F0847B; --crit-soft:#3E1714; --info:#8FB0F2; --info-soft:#16233B; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:18px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 96px;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex:none}
.sub{font-size:12px;color:var(--ink-3)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.block{width:100%;min-height:48px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.hint{font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.collected{background:var(--warn-soft);color:var(--warn)}
.pill.mismatch{background:var(--crit-soft);color:var(--crit)}
.pill.ready,.pill.drafting{background:var(--info-soft);color:var(--info)}
.pill.drafted{background:var(--accent-soft);color:var(--accent)}
.pill.posted{background:var(--good-soft);color:var(--good)}
.pill.skipped{background:var(--surface-2);color:var(--ink-3)}
.pill.trial{background:var(--crit-soft);color:var(--crit)}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--ink-3);font-size:11px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty strong{color:var(--ink-2)}
.banner{border-radius:var(--r);padding:10px 14px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;flex-direction:column;gap:6px}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.good{background:var(--good-soft);color:var(--good)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;min-height:72px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{background:var(--surface-2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding-bottom:6px}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;max-width:100%}
.ph select{font-size:12px;padding:6px;border-radius:8px;margin:0 6px;width:calc(100% - 12px)}
.ph .x{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.verdict{display:inline-flex;align-items:center;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin:0 6px}
.verdict.good{background:var(--good-soft);color:var(--good)} .verdict.warn{background:var(--warn-soft);color:var(--warn)} .verdict.crit{background:var(--crit-soft);color:var(--crit)}
.vnote{font-size:11px;color:var(--ink-3);padding:0 6px}
.addph{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;color:var(--ink-2);font-size:13px;text-align:center;padding:6px;background:var(--surface)}
.addph input{display:none}
.stars{display:flex;gap:2px}
.star{background:none;border:0;font-size:34px;line-height:1;color:var(--line);padding:0 2px}
.star.on{color:var(--warn)}
.check{display:flex;flex-wrap:wrap;gap:6px}
.check .c{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.check .c.ok{background:var(--good-soft);color:var(--good)}
.review textarea{min-height:260px;line-height:1.75;font-size:15px;background:var(--surface)}
.meter{height:6px;border-radius:999px;background:var(--accent-soft);overflow:hidden;flex:1;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan .p{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:10px;padding:6px;font-size:12px;min-width:0}
.plan .p img{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none}
.plan .p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.step.done{background:var(--good-soft);color:var(--good)} .step.now{background:var(--accent);color:var(--accent-ink)}
.sticky{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:8px;background:var(--bg);padding-block:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100vw - 32px);text-align:center}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
summary{cursor:pointer;font-weight:500;color:var(--ink-2)}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation:none} }
pre.doc{white-space:pre-wrap;font-family:var(--font);font-size:13px;line-height:1.65;margin:0;max-height:50vh;overflow:auto;background:var(--surface-2);border-radius:10px;padding:12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" class="toast" hidden role="status"></div>
<script>
(function(){
"use strict";
const STATUS={collected:"사진·메모 필요",mismatch:"사진 확인 필요",ready:"작성 대기",drafting:"작성 중",drafted:"리뷰 완성",posted:"게시됨",skipped:"건너뜀"};
const VERDICT={match:["일치 ✓","good"],unsure:["확인 필요","warn"],mismatch:["다른 상품","crit"]};
const FLAG={stock:"직접 찍은 사진 아님",privacy:"개인정보 보임"};
const TAGS=["전체","비교","디테일","사용","결과","포장","단점"];
const CATS=["식품","생활주방","의류잡화","뷰티","가전디지털","육아반려","가구인테리어","스포츠레저","도서문구","기타"];
const PERIODS=["당일","2~3일","1주","2주","1개월","3개월 이상"];
const API="https://api.github.com";

const S={cfg:null, items:[], shas:{}, reviews:{}, app:null, guide:null, view:"list", sel:null, filter:"active", loading:false, err:"", busy:"", photoUrls:{}, demo:false, pollT:null, lastSync:null};
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){ const el=document.createElement(tag); if(attrs) for(const [k,v] of Object.entries(attrs)){ if(v==null||v===false) continue; if(k==="class") el.className=v; else if(k==="text") el.textContent=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v); else if(v===true) el.setAttribute(k,""); else el.setAttribute(k,v);} for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); } return el; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2800); }
const nowIso=()=>new Date().toISOString();
const kst=(d=new Date())=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul"}).format(d);
function fmtDate(s){ if(!s) return "—"; try{ return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric"}).format(new Date(s.length===10?s+"T00:00:00+09:00":s)); }catch(e){ return s; } }
function fmtDT(s){ if(!s) return "—"; try{ return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(s)); }catch(e){ return s; } }
function daysSince(ymd){ if(!ymd) return null; const a=new Date(ymd.slice(0,10)+"T00:00:00+09:00"), b=new Date(kst()+"T00:00:00+09:00"); return Math.round((b-a)/86400000); }
function addDays(ymd,n){ const d=new Date(ymd.slice(0,10)+"T00:00:00+09:00"); d.setDate(d.getDate()+n); return kst(d); }
function newId(){ const d=kst().replace(/-/g,"").slice(2); return "it_"+d+"_"+Math.random().toString(36).slice(2,7); }
const isActive=it=>!["posted","skipped"].includes(it.status);
function b64encodeUtf8(str){ const bytes=new TextEncoder().encode(str); return b64bytes(bytes); }
function b64bytes(bytes){ let s=""; const CH=0x8000; for(let i=0;i<bytes.length;i+=CH) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH)); return btoa(s); }
function b64decodeUtf8(b64){ const bin=atob((b64||"").replace(/\n/g,"")); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }

// ---------- config ----------
function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem("rl.cfg")||"null"); if(c&&c.token&&c.repo) return c; }catch(e){} return null; }
function saveCfg(c){ try{ localStorage.setItem("rl.cfg",JSON.stringify(c)); }catch(e){} }
function readHash(){
  const hsh=(location.hash||"").slice(1); if(!hsh) return;
  if(hsh==="demo"){ S.demo=true; history.replaceState(null,"",location.pathname+location.search); return; }
  const p=new URLSearchParams(hsh.replace(/^\?/,""));
  const k=p.get("k"), r=p.get("r");
  if(k&&r){ const [owner,repo]=r.split("/"); if(owner&&repo){ saveCfg({token:k.trim(),owner,repo,branch:p.get("b")||"main"}); } }
  history.replaceState(null,"",location.pathname+location.search); // 주소창에서 토큰 제거
}

// ---------- GitHub contents API (또는 데모 저장소) ----------
const demoStore={files:{}, comments:[]};
async function gh(path,opts={}){
  if(S.demo) return demoApi(path,opts);
  const r=await fetch(API+path,Object.assign({},opts,{headers:Object.assign({"Authorization":"Bearer "+S.cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opts.headers||{})}));
  if(r.status===401){ throw {code:"auth",status:401}; }
  if(r.status===404){ throw {code:"notfound",status:404}; }
  if(r.status===409){ throw {code:"conflict",status:409}; }
  if(r.status===403){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} throw {code:"forbidden",status:403,message:m}; }
  if(!r.ok){ let m=""; try{ m=(await r.json()).message||""; }catch(e){} throw {code:"http",status:r.status,message:m}; }
  if(opts.raw) return r;
  if(r.status===204) return null;
  return r.json();
}
const repoPath=p=>"/repos/"+S.cfg.owner+"/"+S.cfg.repo+"/contents/"+p.split("/").map(encodeURIComponent).join("/")+"?ref="+encodeURIComponent(S.cfg.branch);
async function listDir(p){ try{ const a=await gh(repoPath(p)); return Array.isArray(a)?a:[]; }catch(e){ if(e.code==="notfound") return []; throw e; } }
async function getText(p){ try{ const f=await gh(repoPath(p)); return {text:b64decodeUtf8(f.content),sha:f.sha}; }catch(e){ if(e.code==="notfound") return null; throw e; } }
async function getJson(p){ const t=await getText(p); if(!t) return null; try{ return {data:JSON.parse(t.text),sha:t.sha}; }catch(e){ return null; } }
async function getBlobUrl(p){
  if(S.photoUrls[p]) return S.photoUrls[p];
  const r=await gh(repoPath(p),{raw:true,headers:{"Accept":"application/vnd.github.raw+json"}});
  const b=S.demo? r : await r.blob(); const u=URL.createObjectURL(b); S.photoUrls[p]=u; return u;
}
async function putFile(p,base64,message,sha){
  const body={message,content:base64,branch:S.cfg.branch}; if(sha) body.sha=sha;
  const res=await gh("/repos/"+S.cfg.owner+"/"+S.cfg.repo+"/contents/"+p.split("/").map(encodeURIComponent).join("/"),{method:"PUT",body:JSON.stringify(body)});
  return res&&res.content? res.content.sha : null;
}
async function deleteFile(p,sha,message){ return gh("/repos/"+S.cfg.owner+"/"+S.cfg.repo+"/contents/"+p.split("/").map(encodeURIComponent).join("/"),{method:"DELETE",body:JSON.stringify({message,sha,branch:S.cfg.branch})}); }
async function putJson(p,obj,message,sha){ return putFile(p,b64encodeUtf8(JSON.stringify(obj,null,2)+"\n"),message,sha); }
async function wake(text){
  const n=S.app&&S.app.wakePr; if(!n) return false;
  try{ await gh("/repos/"+S.cfg.owner+"/"+S.cfg.repo+"/issues/"+n+"/comments",{method:"POST",body:JSON.stringify({body:text})}); return true; }catch(e){ return false; }
}
// 데모: 네트워크 없이 화면만 보여 주는 가짜 저장소
function demoApi(path,opts){
  const m=path.match(/\/contents\/(.+?)(\?|$)/); const p=m? decodeURIComponent(m[1]):"";
  const method=(opts.method||"GET").toUpperCase();
  if(path.includes("/issues/")){ demoStore.comments.push(JSON.parse(opts.body).body); return Promise.resolve({id:1}); }
  if(method==="GET"){
    if(opts.raw){ const f=demoStore.files[p]; return f&&f.blob? Promise.resolve(f.blob) : Promise.reject({code:"notfound"}); }
    const f=demoStore.files[p];
    if(f) return Promise.resolve({content:f.b64,sha:f.sha,name:p.split("/").pop(),path:p});
    const kids=Object.keys(demoStore.files).filter(k=>k.startsWith(p+"/")).map(k=>k.slice(p.length+1)).filter(k=>!k.includes("/"));
    if(kids.length) return Promise.resolve(kids.map(name=>({name,path:p+"/"+name,sha:demoStore.files[p+"/"+name].sha,type:"file"})));
    return Promise.reject({code:"notfound"});
  }
  if(method==="PUT"){ const b=JSON.parse(opts.body); const sha=Math.random().toString(36).slice(2,10); demoStore.files[p]={b64:b.content,sha,blob:demoStore.pendingBlob||null}; demoStore.pendingBlob=null; return Promise.resolve({content:{sha}}); }
  if(method==="DELETE"){ delete demoStore.files[p]; return Promise.resolve(null); }
  return Promise.reject({code:"http"});
}
function seedDemo(){
  const put=(p,obj)=>{ demoStore.files[p]={b64:b64encodeUtf8(JSON.stringify(obj)),sha:Math.random().toString(36).slice(2,10)}; };
  put("config/app.json",{wakePr:1,name:"리뷰 공방 (데모)"});
  put("config/engine.json",{active:true});
  demoStore.files["config/style_guide.md"]={b64:b64encodeUtf8("# 작성 규칙 (데모)\n\n- 데모 모드라 규칙 전문은 생략합니다."),sha:"g1"};
  const a=newId(), b=newId();
  put("items/"+a+".json",{id:a,productName:"락앤락 비스프리 모듈러 밀폐용기 1.2L 4개",option:"투명",qty:1,orderDate:kst(),category:"생활주방",status:"drafted",photos:[],notes:{rating:5,oneLine:"뚜껑이 한 손으로 열려요",pros:["물때가 안 생김"],cons:["전원선 없음(해당 없음)"],period:"2주",usage:"반찬 보관",forWhom:"자취생"},createdAt:nowIso(),updatedAt:nowIso(),draftedAt:nowIso(),score:86,model:"claude-opus-5-5"});
  put("reviews/"+a+".json",{draft:{body:"2주 동안 반찬 보관용으로 썼는데 뚜껑이 한 손으로 열리는 게 제일 편했어요.\n\n(데모 본문입니다. 실제로는 메모와 사진을 바탕으로 400~650자 완성본이 들어옵니다.)",chars:120,rating:5,photoPlan:[],score:{total:86,parts:{}},questions:[],warnings:[]},photoCheck:{verdict:"ok",summary:"사진 없음(데모)",photos:[]},model:"claude-opus-5-5",draftedAt:nowIso()});

async function loadAll(silent){
  if(!S.cfg&&!S.demo) return;
  if(!silent){ S.loading=true; render(); }
  try{
    const [app,files]=await Promise.all([getJson("config/app.json"), listDir("items")]);
    S.app=app?app.data:null;
    const want=files.filter(f=>f.name.endsWith(".json"));
    const changed=want.filter(f=>S.shas[f.path]!==f.sha);
    const results=await Promise.all(changed.map(async f=>{ const j=await getJson(f.path); return j? {f,j}:null; }));
    const byId=Object.fromEntries(S.items.map(i=>[i.id,i]));
    for(const r of results){ if(!r) continue; const it=r.j.data; it._sha=r.j.sha; it._path=r.f.path; byId[it.id]=it; S.shas[r.f.path]=r.f.sha; }
    const present=new Set(want.map(f=>f.path));
    S.items=Object.values(byId).filter(i=>present.has(i._path)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    for(const it of S.items){ if(["drafted","mismatch","posted"].includes(it.status)&&(!S.reviews[it.id]||S.reviews[it.id]._at!==it.updatedAt)){ const rv=await getJson("reviews/"+it.id+".json"); if(rv){ rv.data._at=it.updatedAt; S.reviews[it.id]=rv.data; } } }
    S.err=""; S.lastSync=nowIso();
  }catch(e){
    S.err = e.code==="auth"? "토큰이 맞지 않거나 만료됐어요. 남편에게 새 링크를 받아 다시 열어 주세요." : e.code==="forbidden"? "저장소 권한이 없어요(토큰 권한: Contents·Issues·Pull requests 읽기/쓰기)." : e.code==="notfound"? "저장소를 찾을 수 없어요. 링크의 저장소 이름을 확인해 주세요." : "불러오지 못했어요. 네트워크를 확인해 주세요.";
  }
  S.loading=false; render(); schedulePoll();
}

async function saveItem(it,patch,msg){
  const next=Object.assign({},it,patch,{updatedAt:nowIso()}); const sha=it._sha; const path="items/"+it.id+".json";

  try{ const ns=await putJson(path,clean,msg||("app: "+it.id),sha); Object.assign(it,clean,{_sha:ns,_path:path}); S.shas[path]=ns; return true; }

    toast(e.code==="auth"?"토큰이 맞지 않아요":"저장하지 못했어요. 다시 시도해 주세요."); return false; }

function loadImage(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("decode")); im.src=url; }); }

async function uploadPhotos(it,files){
  if(!files||!files.length) return; S.busy="사진 올리는 중 0/"+files.length; render();

  for(const f of Array.from(files).slice(0,10)){
    try{ const blob=await shrink(f); const buf=new Uint8Array(await blob.arrayBuffer()); n++; const p="photos/"+it.id+"/"+String(n).padStart(2,"0")+".jpg"; if(S.demo) demoStore.pendingBlob=blob; await putFile(p,b64bytes(buf),"app: 사진 "+it.id); S.photoUrls[p]=URL.createObjectURL(blob); added.push({file:p,tag:""}); S.busy="사진 올리는 중 "+added.length+"/"+files.length; render(); }
    catch(e){ errs.push((f.name||"사진")+": "+(e.code==="auth"?"토큰 오류":e.code? e.code:"읽을 수 없는 형식")); }

  if(errs.length) toast("올리지 못한 사진: "+errs.join(", "));

}
